version = 1
profile = "python-standard"

[report]
path = ".quality-gate/report.json"

[[gate]]
id = "format"
phase = "format"
command = "ruff format --check ."
required = true
safe_fix = "ruff format ."

[[gate]]
id = "clean"
phase = "clean"
command = "ruff check src tests --select C90,PLR"
required = false

[[gate]]
id = "lint"
phase = "lint"
command = "ruff check ."
required = true

[[gate]]
id = "compile"
phase = "type"
command = "python3 -m compileall -q src tests"
required = true

[[gate]]
id = "tests"
phase = "test"
command = "python3 -m unittest discover -s tests -p 'test_*.py' -v"
required = true

[[gate]]
id = "package"
phase = "build"
command = "python3 -m build"
required = true
